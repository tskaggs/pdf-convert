name: pdf-convert-api
region: nyc1

services:
  - name: api
    github:
      repo: tskaggs/pdf-convert
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: PYTHONUNBUFFERED
        value: "1"
        scope: RUN_TIME
      - key: DATA_DIR
        value: "/app/data"
        scope: RUN_TIME
    health_check:
      http_path: "/"
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

