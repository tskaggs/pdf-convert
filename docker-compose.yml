services:
  pdf-convert:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf-convert-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=/app/data
    volumes:
      # Optional: mount a volume for temporary file storage
      - ./temp:/app/temp
      # Persist database
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

